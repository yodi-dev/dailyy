<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dailyy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dailyy - Catatan Kegiatan Harian</title>
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dailyy_theme_v1') || 'indigo-dark';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'sky-light' || saved === 'blush-pink') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', saved === 'sky-light' ? '#f0f9ff' : '#fff1f2');
          } else if (saved === 'emerald-nature') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#022c22');
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Identity Services for Google Drive Backup -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-app-bg text-app-text min-h-screen antialiased font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
