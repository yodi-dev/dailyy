<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dailyy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dailyy - Catatan Kegiatan Harian</title>
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dailyy_theme_v1') || 'indigo-dark';
          document.documentElement.setAttribute('data-theme', saved);
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var colors = {
              'sky-light': '#031726',
              'blush-pink': '#1f0310',
              'emerald-nature': '#022c22',
              'indigo-dark': '#020617'
            };
            meta.setAttribute('content', colors[saved] || '#020617');
          }
          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) {
            appleStatus.setAttribute('content', 'black-translucent');
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Identity Services for Google Drive Backup -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-app-bg text-app-text min-h-screen antialiased font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
